                        <h3>Improver/Taster Session</h3><p>
                        Learn in your local area for full or half day by arrangement. 
                        Exercises and practice, bring yourself a map and compass and 
                        all anticipated  outdoor weather clothing, ideas of what you 
                        want to learn and do that seems oddly not feasible. Ask 
                        for advice and discuss how getting around in the great outdoors
                        can become a hobby you lead your friends on or even just yourself. </p>
                         </article>
        </div>
        </figure>   
        
       <figure class="box1a" >
                        <img src="IMGhomepage/ancient.JPG" alt="Prehistoric">
        <div class="articleboxcol">
                         <article class="dark">  
                        <h3>Challenge Destination</h3><p>
                        Plan for anywhere, somehow, the way I do is to know I can personally
                        do it and have the bike or rucksack with all requirements in advance. 
                        An adventurous approach is the way to get home again without changing your
                        mind. Also each journey continues from the last one and your equipment 
                        is up to date and tested. Self sufficiency is only rural here in the British
                        Isles and where I have travelled but it is wild and you can expect there 
                        are no cafes for a whole day if you want to get to the top of a hill or
                        across a National Park. To not need others is an illusory thing but the 
                        mainstream you will certainly leave it behind.</p>
                         </article>
        </div>
        </figure>    
        <figure class="box1a">
                     <img src="IMGhomepage/Main.JPG" alt="Main view">

                        <h3>Field Trip to take home with you. Art Studies and photography</h3>
                      <p >I have carried a camera in order to not have cold 
                        hands painting, but in the long run it was the quality of the memories that enabled
                       me to painting when I got home. Either way though it puts a date and register to your 
                        memories if you draw or keep photographs. Like an extension to maps and a 
                      diary it adds value to memories when you have the ability to pull them out
                      accurately for yourself. <br>
                   <b> See section BrightCalmIllustrations to connect art with Trailtour  </b></p>
